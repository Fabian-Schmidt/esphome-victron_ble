---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main, dev, beta, release]
    tags: ["*"]

  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Same Python version ESPHome uses in its own CI (requires-python >=3.12).
  DEFAULT_PYTHON: "3.12"

jobs:
  ci:
    name: ${{ matrix.file }} (esphome ${{ matrix.esphome }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/test.ble_connect.esp32-ard.yaml
          - tests/test.ble_connect.esp32-idf.yaml
          - tests/test.ble.esp32-ard.yaml
          - tests/test.ble.esp32-idf.yaml
          - tests/test.ble.rp2-ard.yaml
        # Oldest supported release plus whatever is current on PyPI, so
        # upstream breakages show up before users report them.
        esphome: ["2026.9.1", "latest"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install ESPHome
        run: |
          python -m pip install -U pip
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
          esphome version

      # Per test-file cache, the frameworks/toolchains differ between them.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          # yamllint disable-line rule:line-length
          key: platformio-${{ matrix.esphome }}-${{ hashFiles(matrix.file) }}-${{ github.run_id }}
          restore-keys: |
            platformio-${{ matrix.esphome }}-${{ hashFiles(matrix.file) }}-

      - name: Validate config
        run: esphome config ${{ matrix.file }}

      - name: Compile
        run: esphome compile ${{ matrix.file }}

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Successful build
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing build
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
